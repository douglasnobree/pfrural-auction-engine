services:
  postgres:
    image: postgres:16-alpine
    container_name: pfrural-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auction_engine}
      POSTGRES_USER: ${POSTGRES_USER:-auction_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_engine}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - auction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - auction-engine

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pfrural-auction-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-auction_engine}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-auction_engine}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - auction_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - auction-engine

  redis:
    image: redis:7.2-alpine
    container_name: pfrural-auction-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - auction_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - auction-engine

volumes:
  auction_postgres_data:
  auction_rabbitmq_data:
  auction_redis_data:

networks:
  auction-engine:
    name: pfrural-auction-engine
    driver: bridge
